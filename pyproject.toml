[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fudufosy-moe_route_imbalance_grouping"
version = "0.1.0"
description = "按结构键把条目聚类，标出自动驾驶感知工程师·MoE 路由的负载不均上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fudufosy" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fudufosy.github.io"
Repository = "https://github.com/fudufosy/moe_route_imbalance_grouping"
Issues = "https://github.com/fudufosy/moe_route_imbalance_grouping/issues"

[project.scripts]
moe_route_imbalance_grouping = "moe_route_imbalance_grouping:main"

[tool.setuptools]
py-modules = ["moe_route_imbalance_grouping"]
